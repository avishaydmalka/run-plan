<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>תוכנית ריצה – חצי מרתון ת"א 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ec; --card:#fffdf9; --ink:#1b2430; --muted:#6b7280; --line:#e6e0d6;
  --accent:#ff5a1f; --accent-soft:#ffe6db; --ok:#15803d; --ok-soft:#dcfce7;
  --navy:#14213d;
  --t-hill:#c2410c; --t-lsd:#1d4ed8; --t-fart:#7c3aed; --t-comb:#0f766e; --t-z1:#64748b;
  --t-prog:#b45309; --t-int:#be123c; --t-tempo:#a21caf; --t-test:#0369a1; --t-race:#ff5a1f; --t-rest:#c9c3b8;
  --safe-top:env(safe-area-inset-top,0px); --safe-bot:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f141b;--card:#18202b;--ink:#eef1f5;--muted:#9aa3af;--line:#283241;--accent-soft:#3a2016;--ok-soft:#12301f;--navy:#0b1220;--t-rest:#3a4452}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-top:var(--safe-top);padding-bottom:calc(72px + var(--safe-bot))}
h1,h2,h3,.num{font-family:Rubik,Heebo,sans-serif}
button{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:16px}
header.top{background:var(--navy);color:#fff;padding:18px 16px 22px;border-radius:0 0 22px 22px}
header.top .wrap{padding:0 16px}
.top-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.top h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.2px}
.top .sub{opacity:.75;font-size:13px;margin-top:2px}
.count{text-align:center;background:rgba(255,255,255,.08);border-radius:14px;padding:8px 12px;min-width:84px}
.count .num{font-size:28px;font-weight:800;line-height:1;color:var(--accent)}
.count small{font-size:11px;opacity:.8}
.phasebar{display:flex;gap:3px;margin-top:16px}
.phasebar div{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.15);position:relative}
.phasebar div.done{background:rgba(255,255,255,.55)}
.phasebar div.now{background:var(--accent)}
.phaselbl{display:flex;justify-content:space-between;font-size:11px;opacity:.75;margin-top:6px}

nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + var(--safe-bot));z-index:20}
nav.tabs a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-size:12px;padding:4px 0;border-radius:10px}
nav.tabs a .ic{display:block;font-size:20px;line-height:1.2}
nav.tabs a.on{color:var(--accent);font-weight:700}

.view{display:none}.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.lbl{font-size:12px;font-weight:700;letter-spacing:.3px;color:var(--muted);text-transform:uppercase;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.hero{border:none;color:#fff;position:relative;overflow:hidden}
.hero .lbl{color:rgba(255,255,255,.8)}
.hero h2{margin:2px 0 4px;font-size:30px;font-weight:800}
.hero .meta{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.18)}
.pill.l{background:var(--accent-soft);color:var(--accent)}
.desc{white-space:pre-line;line-height:1.6;font-size:15px}
.hero .desc{background:rgba(0,0,0,.14);border-radius:12px;padding:12px;font-size:14.5px}
.extra{margin-top:8px;font-size:13px;font-weight:600;opacity:.9}
.mini{display:flex;gap:12px;align-items:center}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.mini .t{font-weight:700}
.mini .k{color:var(--muted);font-size:13px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 14px;font-weight:600;cursor:pointer}
a.btn{text-decoration:none;display:inline-block;text-align:center}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn:disabled{opacity:.5}
.donebadge{display:inline-flex;gap:4px;align-items:center;background:var(--ok-soft);color:var(--ok);font-weight:700;font-size:12px;padding:3px 10px;border-radius:999px}

.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.ws{background:var(--bg);border-radius:12px;padding:8px 2px;text-align:center;cursor:pointer;border:2px solid transparent}
.ws.today{border-color:var(--accent)}
.ws .d{font-size:11px;color:var(--muted)}
.ws .n{font-family:Rubik;font-weight:700;font-size:16px}
.ws .b{height:4px;border-radius:2px;margin:5px 8px 0}
.ws .km{font-size:11px;color:var(--muted);margin-top:3px;min-height:14px}
.ws.done .n{color:var(--ok)}
.progress{height:10px;background:var(--bg);border-radius:6px;overflow:hidden;margin-top:8px}
.progress>div{height:100%;background:var(--ok);border-radius:6px}

/* calendar */
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.calhead h2{margin:0;font-size:20px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal .dn{font-size:11px;text-align:center;color:var(--muted);padding-bottom:4px}
.cell{min-height:64px;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px;cursor:pointer;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.cell.out{opacity:.35;cursor:default}
.cell.today{outline:2px solid var(--accent);outline-offset:-1px}
.cell .n{font-family:Rubik;font-size:12px;font-weight:700;display:flex;justify-content:space-between}
.cell .tg{font-size:9.5px;font-weight:700;color:#fff;border-radius:5px;padding:1px 1px;white-space:nowrap;overflow:hidden;text-overflow:clip;text-align:center;letter-spacing:-.2px}
.cell .km{font-size:10px;color:var(--muted)}
.cell.rest .tg{display:none}
.legend{display:flex;flex-wrap:wrap;gap:8px 12px;font-size:12px;color:var(--muted);margin-top:12px}
.legend span{display:inline-flex;gap:5px;align-items:center}

/* weeks */
.wk{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.wk:last-child{border-bottom:none}
.wk .wn{font-family:Rubik;font-weight:800;font-size:20px;text-align:center}
.wk .wn small{display:block;font-size:10px;font-weight:500;color:var(--muted)}
.wk .bar{height:8px;background:var(--bg);border-radius:4px;position:relative;margin-top:6px}
.wk .bar i{position:absolute;inset:0 0 0 auto;border-radius:4px;opacity:.35}
.wk .bar b{position:absolute;inset:0 0 0 auto;border-radius:4px;background:var(--ok)}
.wk.cur{background:var(--accent-soft);border-radius:12px;padding-inline:8px}
.wk .h{display:flex;justify-content:space-between;font-size:14px}
.wk .h .p{font-weight:700}
.wk .h .v{color:var(--muted);font-size:13px}

/* sheet (day modal) */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none}
.scrim.on{display:block}
.sheet{visibility:hidden;position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:8px 16px calc(20px + var(--safe-bot));z-index:41;transform:translateY(105%);transition:transform .25s ease}
.sheet.on{transform:none;visibility:visible}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet h3{margin:4px 0 2px;font-size:22px}
.sheet .wrapi{max-width:720px;margin:0 auto}
.logbox{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);display:grid;gap:10px}
.logbox label{font-size:13px;color:var(--muted);display:grid;gap:4px}
.logbox input,.logbox textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.logbox textarea{min-height:60px;resize:vertical}
.note{font-size:12px;color:var(--muted)}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px;min-height:40vh}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;line-height:1.55;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
.msg.u{align-self:flex-start;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.msg.a{align-self:flex-end;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.a strong{font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.composer{position:sticky;bottom:calc(70px + var(--safe-bot));display:flex;gap:8px;background:var(--bg);padding:8px 0}
.composer textarea{flex:1;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;resize:none;height:46px;max-height:120px}
.warn{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.5}
.gem{display:grid;gap:6px;margin-top:8px}
.gem input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;direction:ltr}
.hidden{display:none!important}
body.onb nav.tabs{display:none}
body.onb{padding-bottom:20px}
.gear{text-decoration:none;display:inline-block;background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:12px;padding:6px 10px;font-size:13px;cursor:pointer;margin-top:8px}
.form{display:grid;gap:12px}
.form label{display:grid;gap:5px;font-size:14px;font-weight:600}
.form label small{font-weight:400;color:var(--muted);font-size:12px}
.form input,.form select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
.form input.ltr{direction:ltr;text-align:left}
.tm{display:flex;gap:8px}.tm label{flex:1;font-weight:400}.tm label small{text-align:center}.tm input{text-align:center;font-size:18px;font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.steps{margin:0;padding-inline-start:20px;line-height:1.7;font-size:14.5px}
.steps a{color:var(--accent);font-weight:700}
.zones{display:grid;grid-template-columns:1fr auto auto;gap:6px 12px;font-size:14px;align-items:center}
.zones .h{font-size:12px;color:var(--muted);font-weight:700}
.zones .num{font-weight:700}
.welcome{background:linear-gradient(135deg,var(--navy),#2b3a67);color:#fff;border:none}
.welcome h2{margin:0 0 6px;font-size:24px}
.stepper{display:flex;gap:6px;margin:10px 0 2px}.stepper i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.25)}.stepper i.on{background:var(--accent)}
.okmsg{color:var(--ok);font-weight:700;font-size:13px}.errmsg{color:#dc2626;font-weight:600;font-size:13px}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:14px;padding:10px 12px;margin-bottom:14px;font-size:14px}

</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div>
        <h1>חצי מרתון ת"א · 26.2.27</h1>
        <div class="sub" id="hdrSub"></div>
        <a class="gear" href="#settings" id="gearBtn">⚙️ <span id="hdrName">הגדרות</span></a>
      </div>
      <div class="count"><div class="num" id="cdNum">–</div><small id="cdLbl">ימים למרוץ</small></div>
    </div>
    <div class="phasebar" id="phasebar"></div>
    <div class="phaselbl"><span>בסיס</span><span>בנייה</span><span>שיא · חידוד · 🏁</span></div>
  </div>
</header>

<main class="wrap">
  <section class="view" id="v-today"></section>
  <section class="view" id="v-calendar"></section>
  <section class="view" id="v-weeks"></section>
  <section class="view" id="v-settings"></section>
  <section class="view" id="v-chat">
    <div class="card" style="padding:12px 14px">
      <div class="lbl" style="margin:0"><span>שאל את המאמן הדיגיטלי</span><button class="chip" id="clearChat" style="padding:3px 10px">ניקוי</button></div>
      <div class="note" id="aiNote">התשובות מבוססות על התוכנית ועל מה שסימנת כבוצע.</div>
      <div class="note" id="chatModel" style="margin-top:4px"></div>
      <div class="warn hidden" id="gemBox" style="margin-top:8px">כדי לשאול צריך מפתח Gemini חינמי (2 דקות). <a href="#settings" style="color:var(--accent);font-weight:700">להגדרה ←</a></div>
    </div>
    <div class="chips" id="chips"></div>
    <div class="chat" id="chat"></div>
    <div class="composer">
      <textarea id="q" placeholder="למשל: מה סיכום השבוע?"></textarea>
      <button class="btn pri" id="send">שלח</button>
    </div>
  </section>
</main>

<nav class="tabs">
  <a href="#today" data-v="today"><span class="ic">🏃</span>היום</a>
  <a href="#calendar" data-v="calendar"><span class="ic">📅</span>לוח שנה</a>
  <a href="#weeks" data-v="weeks"><span class="ic">📊</span>שבועות</a>
  <a href="#chat" data-v="chat"><span class="ic">💬</span>שאל</a>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="wrapi"><div class="grab"></div><div id="sheetBody"></div></div></div>

  get(k, def){ try{ const v = localStorage.getItem(k); return v==null?def:JSON.parse(v); }catch(e){ return def; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

const cleanKey = k => String(k||'').replace(/[^\x21-\x7E]/g,'');

const parse = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };

const fmt = s => { const d=parse(s); return `${d.getDate()}.${d.getMonth()+1}`; };

const kmNum = k => { if(!k) return 0; const p=String(k).split('-').map(Number); return p.reduce((a,b)=>a+b,0)/p.length; };

const hms = sec => { sec=Math.round(sec); const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60; return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`; };
function parseTime(str){
  const p = String(str||'').trim().split(':').map(x=>x.trim());
  if(!p.length || p.some(x=>x===''||isNaN(+x))) return null;
  const n = p.map(Number);
  if(n.length===2) return n[0]*60+n[1];
  if(n.length===3) return n[0]*3600+n[1]*60+n[2];

const TESTS = {
  '10k_test': {label:'10 ק"מ', km:10,      hrToLt:1.00},

function calc(p){
  if(!p || p.skipped || !p.time) return null;
  if(p.testType==='10k_race') p.testType='10k_test';

  const t10 = p.time * Math.pow(10 / t.km, 1.06) * (est?EST_FACTOR:1);   // Riegel equivalent 10K

  const z = {};

         .replace(/מבחינת קצב נסה לכוון ל-\{\{p:5:08\}\} דק'\/ק"מ/g,'מבחינת קצב – מאמץ אחיד ומקסימלי לכל ה-10 ק"מ')

    t = t.replace(/~?\s*\{\{p:(\d+:\d\d)\}\}(?:-\{\{p:\d+:\d\d\}\})?\s*דק'\/ק"מ/g, (_,a)=>EFFORT[a]||'לפי תחושה');
  }
  if(!C || !C.z.ltc){
    t = t.replace(/דופק \{\{hr:easy\}\}/g,'בדופק נמוך – אפשר לדבר בחופשיות')
         .replace(/\s*\(דופק ~\{\{hr:lt\}\}\)/g,'')
         .replace(/\(דופק \{\{hr:easy\}\}\)/g,'(שיחה חופשית)')
         .replace(/טווח דופק \{\{hr:z23\}\}/g,'מאמץ בינוני – מתחיל להיות לא נוח לדבר');
  }
  return t
    .replace(/\{\{p:(\d+):(\d\d)\}\}/g, (_,m,s)=>{ const sec=(+m)*60+(+s); return mmss(C?sec*C.r:sec); })
    .replace(/\{\{hr:easy\}\}/g, ()=> C&&C.z.easy ? `${C.z.easy[0]}-${C.z.easy[1]}` : '130-140')
    .replace(/\{\{hr:z23\}\}/g,  ()=> C&&C.z.z23 ? `${C.z.z23[0]}-${C.z.z23[1]}` : 'Z2-3')
    .replace(/\{\{hr:lt\}\}/g,   ()=> C&&C.z.ltc ? `${C.z.ltc}` : 'סף');
}

// ---------- plan helpers ----------
function typeColor(t){
  if(!t || t==='מנוחה') return 'var(--t-rest)';
  if(t.includes('חצי')) return 'var(--t-race)';
  if(t.includes('עליות')) return 'var(--t-hill)';
  if(t.includes('LSD')) return 'var(--t-lsd)';
  if(t.includes('פרטלק')) return 'var(--t-fart)';
  if(t.includes('משולב')) return 'var(--t-comb)';
  if(t.includes('מתגברת')) return 'var(--t-prog)';
  if(t.includes('אינטרוול')) return 'var(--t-int)';
  if(t.includes('טמפו')) return 'var(--t-tempo)';
  if(t.includes('טסט')) return 'var(--t-test)';
  return 'var(--t-z1)';
}
function shortType(t){
  if(t.includes('חצי')) return '🏁 מרוץ';
  if(t.includes('משולב')) return 'משולב';
  if(t.includes('מתגברת')) return 'מתגברת';
  if(t.includes('אינטרוול')) return 'אינטרו׳';
  if(t.includes('טסט')) return 'טסט 10';
  if(t.includes('Z1')) return 'Z1';
  return t;
}
const isRest = d => !d || d.type==='מנוחה';
const weekOf = s => { const d=byDate[s]; return d ? WEEKS[d.week-1] : null; };
const weekDays = w => DAYS.filter(d=>d.week===w.week);
const doneKm = w => weekDays(w).reduce((a,d)=>a+(LOG[d.date]?.done ? (Number(LOG[d.date].km)||kmNum(d.km)) : 0),0);

function zonesTable(){

let calMonth = null;
function renderCalendar(){
  const first = parse(PLAN.start), last = parse(DAYS[DAYS.length-1].date);

  const y=calMonth.getFullYear(), m=calMonth.getMonth();
  const minM = new Date(first.getFullYear(),first.getMonth(),1), maxM = new Date(last.getFullYear(),last.getMonth(),1);
  const startCell = new Date(y,m,1-new Date(y,m,1).getDay());
  let cells='';
  for(let i=0;i<42;i++){
    const dt = new Date(startCell); dt.setDate(startCell.getDate()+i);
    if(i>=35 && dt.getMonth()!==m) break;
    const s = iso(dt), d = byDate[s], L = LOG[s];
    const inMonth = dt.getMonth()===m;
    if(!d || !inMonth){ cells += `<div class="cell out"><div class="n"><span>${dt.getDate()}</span></div></div>`; continue; }
    cells += `<div class="cell ${isRest(d)?'rest':''} ${s===TODAY?'today':''}" data-open="${s}">
      <div class="n"><span>${dt.getDate()}</span>${L?.done?'<span style="color:var(--ok)">✓</span>':''}</div>
      <div class="tg" style="background:${typeColor(d.type)}">${esc(shortType(d.type))}</div>
      <div class="km">${isRest(d)?'':esc(d.km)}</div></div>`;
  }
  const types = [['עליות','עליות'],['LSD','LSD'],['פרטלק','פרטלק'],['ריצה מתגברת','מתגברת'],['אינטרוולים','אינטרוולים'],['טמפו','טמפו'],['איכות משולב','משולב'],['Z1','Z1'],['טסט','טסט'],['חצי','מרוץ']];
  $('#v-calendar').innerHTML = `<div class="card">
    <div class="calhead"><button class="btn" id="calPrev" ${calMonth<=minM?'disabled':''}>→</button><h2>${HEB_MON[m]} ${y}</h2><button class="btn" id="calNext" ${calMonth>=maxM?'disabled':''}>←</button></div>
    <div class="cal">${HEB_DOW.map(x=>`<div class="dn">${x}</div>`).join('')}${cells}</div>
    <div class="legend">${types.map(([k,l])=>`<span><i class="dot" style="background:${typeColor(k)}"></i>${l}</span>`).join('')}</div>
  </div>`;
  $('#calPrev').onclick=()=>{calMonth=new Date(y,m-1,1);renderCalendar();};
  $('#calNext').onclick=()=>{calMonth=new Date(y,m+1,1);renderCalendar();};
}

// ---------- server (Cloudflare Worker) ----------
let SERVER = null;                         // {sharedChat, inviteRequired, coach} when /api is reachable
let CODE = store.get('rp.code', null);     // personal sync code
const fmtCode = c => c ? c.slice(0,4)+'-'+c.slice(4) : '';
async function apiFetch(path, opts={}){
  const r = await fetch(path, Object.assign({headers:{'content-type':'application/json'}}, opts));
  let j = {}; try{ j = await r.json(); }catch(e){}
  if(!r.ok) throw Object.assign(new Error(j.error || ('HTTP '+r.status)), {status:r.status});
  return j;
}
let syncTimer = null, syncState = '';
function markDirty(){ store.set('rp.dirty', true); scheduleSync(); }
function scheduleSync(){ if(!SERVER || !CODE) return; clearTimeout(syncTimer); syncTimer = setTimeout(pushNow, 800); }
async function pushNow(){
  if(!SERVER || !CODE) return;
  try{
    await apiFetch('/api/user/'+CODE, {method:'PUT', body: JSON.stringify({name: PROFILE?.name||'', profile: PROFILE, log: LOG})});
    store.set('rp.dirty', false); syncState = 'ok';
  }catch(e){ syncState = 'err'; }
  const el = $('#syncState'); if(el) el.textContent = syncLabel();
}
const syncLabel = () => !SERVER ? 'ללא שרת – נשמר רק במכשיר' : !CODE ? '' : syncState==='err' ? '⚠️ הסנכרון נכשל, ננסה שוב' : store.get('rp.dirty',false) ? 'מסנכרן…' : '☁️ מסונכרן';
async function pullFromServer(code){
  const d = await apiFetch('/api/user/'+code);
  PROFILE = d.profile || null; LOG = d.log || {};
  if(PROFILE && d.name && !PROFILE.name) PROFILE.name = d.name;
  store.set('rp.profile', PROFILE); store.set('rp.log', LOG); store.set('rp.dirty', false);
  C = calc(PROFILE);
  return d;
}
async function initServer(){
  if(!/^https?:$/.test(location.protocol)) return;
  try{ SERVER = await apiFetch('/api/health'); }catch(e){ SERVER = null; return; }
  if(CODE){
    try{
      if(store.get('rp.dirty', false)) await pushNow(); else await pullFromServer(CODE);
      syncState='ok';
    }catch(e){ if(e.status===404){ CODE=null; store.del('rp.code'); } }
  }
  if(ONBOARDING && CODE && PROFILE) ONBOARDING = false;
  if(ONBOARDING && !CODE) setupStep = 'start';
  renderAll(); route();
}

function readProfileForm(){
  const v = id => { const el=$(id); const n = el && !el.closest('.hidden') ? parseInt(el.value,10) : 0; return isNaN(n)?0:n; };
  const mRaw = $('#pfM').value.trim();
  const time = mRaw==='' ? null : (v('#pfH')*3600 + v('#pfM')*60 + Math.min(59, v('#pfS'))) || null;
  const num = id => { const v=+$(id).value; return v>0?Math.round(v):null; };
  return {name:$('#pfName').value.trim(), testType:$('#pfType').value, source:$('#pfSrc').value, time, testHr:num('#pfTestHr'), restHr:num('#pfRest'), maxHr:num('#pfMax')};
}
function validateProfile(p){
  if(!p.time) return 'הזן זמן (דקות ושניות)';
  const pace = p.time / TESTS[p.testType].km;
  if(pace < 150 || pace > 600) return 'הזמן לא נראה הגיוני למרחק שנבחר';
  if(p.testHr && (p.testHr<100||p.testHr>220)) return 'דופק ממוצע לא הגיוני';
  if(p.restHr && (p.restHr<30||p.restHr>100)) return 'דופק מנוחה לא הגיוני';
  return '';
}

function modelOptions(){
  const list = GEM.models || [];
  if(!list.length) return `<option value="${esc(GEM.model||'')}">${esc(GEM.model||'אוטומטי (ברירת מחדל)')}</option>`;
  return list.map(m=>`<option value="${esc(m.id)}" ${m.id===GEM.model?'selected':''}>${esc(m.label)} · ${esc(m.id)}</option>`).join('');
}
async function loadModels(fresh){
  const key = cleanKey(GEM.key);
  const q = fresh ? '' : ('?prefer=' + encodeURIComponent(GEM.model||''));
  const d = await apiFetch('/api/models'+q, {headers: key ? {'x-gemini-key': key} : {}});
  GEM.models = d.models || [];
  const keep = !fresh && GEM.model && GEM.models.some(m=>m.id===GEM.model);
  if(!keep) GEM.model = d.recommended || (GEM.models[0]||{}).id || '';
  store.set('rp.gemini', GEM); renderChatModel();
  return d;
}
function renderChatModel(){ const el=$('#chatModel'); if(el) el.innerHTML = `מודל: <span dir="ltr">${esc(GEM.model||'אוטומטי')}</span> · <a href="#settings" style="color:var(--accent)">החלפה</a>`; }

// ---------- AI ----------
async function gemini(msgs, system){
  const key = cleanKey(GEM.key);
  if(!key) throw new Error('אין מפתח Gemini – הגדר אותו בהגדרות.');
  if(/^https?:$/.test(location.protocol)){   // go through our server: avoids browser/CORS issues (notably Safari)
    try{
      const d = await apiFetch('/api/chat',{method:'POST', headers:{'content-type':'application/json','x-gemini-key':key}, body: JSON.stringify({code: CODE||'', system, messages: msgs, model: GEM.model||''})});
      return {text: d.text, model: d.model};
    }catch(e){ if(e.status !== 404) throw e; }   // 404 = no server here (e.g. static hosting) → call Google directly
  }
  const models = [...new Set([GEM.model, ...GEM_MODELS].filter(Boolean))];
  let lastErr;
  for(const model of models){
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{
      method:'POST', headers:{'Content-Type':'application/json','x-goog-api-key':key},
      body: JSON.stringify({systemInstruction:{parts:[{text:system}]}, contents: msgs.map(m=>({role:m.role==='user'?'user':'model',parts:[{text:m.content}]}))})});
    let j={}; try{ j = await r.json(); }catch(e){}
    if(r.ok) return {text: j.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('') || '(אין תשובה)', model};
    lastErr = new Error(r.status===429 ? 'הגעת למגבלת הבקשות החינמית. נסה שוב בעוד דקה.' : (j?.error?.message || ('HTTP '+r.status)));
    if([400,401,403].includes(r.status)) break;   // key problem – another model won't help
  }
  throw lastErr;
}

${prof}
מחזוריות 2:1 = שני שבועות עומס ואחריהם שבוע מופחת. "איכות משולב" הוא אימון קבוצתי/משולב שתוכנו נקבע ביום עצמו (6-7 ק"מ). סח"ח = סף חומצת חלב.
התוכנית מבוססת על תבנית של מאמן; אל תמציא שינויים בה אלא אם נשאלת. אם יש כאב, פציעה או חשש רפואי – המלץ לפנות לאיש מקצוע.

סיכום שבועי (שבוע, התחלה, שלב, נפח, LSD, ביצוע בפועל):
${WEEKS.map(w=>`${w.week} | ${w.start} | ${w.phase} ${w.phaseWeek} | ${w.cycle} | ${w.km} ק"מ | LSD ${w.lsd} | בוצע ${r1(doneKm(w))} ק"מ${w.note?' | '+w.note:''}`).join('\n')}

כל האימונים (ימים שלא מופיעים = מנוחה):
${lines.join('\n')}

תיאורי האימונים המלאים:
${Object.values(uniq).map(d=>`[${d.date} ${d.type} ${d.km}]: ${tok(d.desc).replace(/\n/g,' / ')}${d.extra?' ('+d.extra+')':''}`).join('\n')}`;
}
function md(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/^#+\s*(.+)$/gm,'<strong>$1</strong>').replace(/^[-*]\s+/gm,'• '); }
function renderChat(){
  $('#chips').innerHTML = CHIPS.map(c=>`<button class="chip">${esc(c)}</button>`).join('');
  $('#chat').innerHTML = CHAT.length ? CHAT.map(m=>`<div class="msg ${m.role==='user'?'u':'a'}">${m.role==='user'?esc(m.content):md(m.content)+(m.model?`<div class="note" style="margin-top:6px;font-size:11px;direction:ltr;text-align:left">${esc(m.model)}</div>`:'')}</div>`).join('')
    : `<div class="note" style="text-align:center;padding:20px">שאל כל דבר על התוכנית, על אימון מסוים או על ההתקדמות שלך.</div>`;
  updateChatBox();
}
function updateChatBox(){ $('#gemBox').classList.toggle('hidden', !!(sample || GEM.key || (SERVER && SERVER.sharedChat && CODE))); }
let busy=false;
async function ask(text){
  text = text.trim(); if(!text || busy) return;
  busy=true; $('#send').disabled=true;
  CHAT.push({role:'user',content:text}); CHAT.push({role:'assistant',content:'…'}); renderChat(); scrollEnd();
  const idx = CHAT.length-1;
  const msgs = CHAT.slice(0,-1).slice(-12);
  const t0 = Date.now();
  const tick = setInterval(()=>{ if(CHAT[idx].pending){ CHAT[idx].content = `חושב… ${Math.round((Date.now()-t0)/1000)} שנ׳`; const el=$('#chat').lastElementChild; if(el) el.textContent = CHAT[idx].content; } }, 1000);
  CHAT[idx].pending = true;
  try{
    if(!GEM.key && SERVER && SERVER.sharedChat && CODE){
      const d = await apiFetch('/api/chat',{method:'POST', body: JSON.stringify({code: CODE, system: planContext(), messages: msgs, model: GEM.model||''})});
      CHAT[idx].content = d.text; CHAT[idx].model = d.model;
    } else if(sample && !GEM.key){
      const input = [{role:'user',content:planContext()+'\n\n---\nשאלה ראשונה של המתאמן מתחילה כאן.'},{role:'assistant',content:'הבנתי. אני מכיר את התוכנית ומוכן לשאלות.'}, ...msgs];
      const res = await sample(input,{cache:false, onText:({text})=>{CHAT[idx].content=text||'…'; updateLast(idx);}});
      CHAT[idx].content = res.text;
    } else {
      if(!GEM.key) throw new Error('צריך מפתח Gemini – הגדר אותו בהגדרות.');
      const g = await Promise.race([gemini(msgs, planContext()),
        new Promise((_,rej)=>setTimeout(()=>rej(new Error('לא התקבלה תשובה תוך 75 שניות – המודלים עמוסים כרגע. נסה שוב, או בחר מודל אחר בהגדרות.')), 75000))]);
      CHAT[idx].content = g.text; CHAT[idx].model = g.model;
    }
  }catch(e){
    const c = e?.code;
    const netErr = e instanceof TypeError || /load failed|failed to fetch|type error|networkerror/i.test(e?.message||'');
    CHAT[idx].content = c==='rate_limited' ? 'יותר מדי בקשות כרגע, נסה שוב בעוד דקה.' : c==='not_granted' ? 'לא אושרה גישה למודל.' : netErr ? 'לא הצלחתי להתחבר לשרת. נסה שוב בעוד רגע.\n(' + (e?.name||'') + ': ' + (e?.message||'') + ')' : 'שגיאה: ' + (e?.message || c || e);
  }
  clearInterval(tick); CHAT[idx].pending = false;
  busy=false; $('#send').disabled=false; renderChat(); scrollEnd();
}
function updateLast(i){ const el=$('#chat').lastElementChild; if(el) el.innerHTML = md(CHAT[i].content); scrollEnd(); }
function scrollEnd(){ window.scrollTo({top:document.body.scrollHeight}); }

// ---------- routing ----------
const VIEWS=['today','calendar','weeks','chat','settings'];
function route(){
  let h = (location.hash||'').slice(1); let v = VIEWS.includes(h)?h:'today';
  if(ONBOARDING) v='settings';
  document.body.classList.toggle('onb', ONBOARDING);
  if(v==='settings') renderSettings();
  VIEWS.forEach(x=>{ $('#v-'+x).classList.toggle('on',x===v); });
  document.querySelectorAll('nav.tabs a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));
  if(v!=='chat') window.scrollTo({top:0});
}
function renderAll(){ renderHeader(); renderToday(); renderCalendar(); renderWeeks(); renderChat(); }

document.addEventListener('click', e=>{
  const ak = e.target.closest('[data-ask]');
  if(ak){ closeSheet(); setTimeout(()=>ask(ak.dataset.ask),50); return; }
  const op = e.target.closest('[data-open]'); if(op){ openDay(op.dataset.open); return; }
  const wk = e.target.closest('[data-week]'); if(wk){ const w=WEEKS[+wk.dataset.week-1]; const s=parse(w.start); calMonth=new Date(s.getFullYear(),s.getMonth(),1); renderCalendar(); location.hash='calendar'; return; }
  const ch = e.target.closest('.chip'); if(ch && ch.tagName==='BUTTON' && ch.id!=='clearChat'){ ask(ch.textContent==='סיכום השבוע'?'תן לי סיכום של השבוע הנוכחי: מה עשיתי, מה נשאר ומה הדגשים.':ch.textContent); }
});
$('#scrim').onclick = closeSheet;
$('#send').onclick = ()=>{ const v=$('#q').value; $('#q').value=''; ask(v); };
$('#q').addEventListener('keydown',e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); $('#send').click(); }});
$('#clearChat').onclick = ()=>{ CHAT.length=0; renderChat(); };
window.addEventListener('hashchange', route);
setInterval(()=>{ const t=iso(new Date()); if(t!==TODAY){ TODAY=t; renderAll(); } }, 60000);

renderAll(); route(); renderChatModel();
initServer();

// Optional: when opened inside Claude, its built-in model can answer without a Gemini key.
if(window.claude && window.claude.use){
  window.claude.use('sample').then(s=>{ sample=s; updateChatBox(); }).catch(()=>{});
}
})();
</script>
